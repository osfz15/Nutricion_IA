<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriVision AI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>NutriVision AI</h1>
            <p id="status-reminder">Próxima comida: Programando...</p>
        </header>

        <!-- SECCIÓN DE CÁMARA -->
        <section id="camera-section">
            <!-- El atributo muted ayuda a que el autoplay funcione en Android -->
            <video id="webcam" autoplay playsinline muted></video>
            
            <div style="padding: 10px; width: 90%;">
                <input type="text" id="food-description" placeholder="Ejem: Es pollo con salsa, poca grasa..." 
                       style="width: 100%; padding: 12px; border-radius: 10px; border: none; background: #334155; color: white; margin-bottom: 10px;">
            </div>

            <button id="capture-btn">📸 Analizar Comida</button>
        </section>

        <!-- TARJETA DE RESULTADOS -->
        <div id="result-card" class="hidden">
            <h3>Análisis de la IA</h3>
            <p><strong>Plato:</strong> <span id="food-name">Esperando...</span></p>
            <p><strong>Calorías est.:</strong> <span id="calories">0</span> kcal</p>
            <button id="save-btn">Guardar en Diario</button>
        </div>

        <!-- CONFIGURACIÓN DE RECORDATORIO -->
        <section id="reminder-config" style="margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 15px;">
            <h3 style="margin-top:0; font-size: 1rem;">⏰ Alarma de Comida</h3>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="time" id="reminder-time" style="padding: 10px; border-radius: 8px; border: none; flex-grow: 1;">
                <button id="set-reminder-btn" style="background: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold;">
                    Programar
                </button>
            </div>
            <p id="reminder-status" style="font-size: 0.75rem; margin-top: 10px; color: #94a3b8; margin-bottom:0;"></p>
        </section>

        <nav class="tab-bar">
            <button class="nav-btn">🏠 Inicio</button>
            <button class="nav-btn">📊 Progreso</button>
            <button class="nav-btn">🔔 Horarios</button>
        </nav>
    </div>

    <!-- Asegúrate de que el archivo en GitHub se llame app.js en minúsculas -->
    <script src="app.js"></script>
</body>
</html>
